server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/mime.types;

    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-cOqNf9rQBC2f9uweTItN+UYLKXcmFRduAHEYm3N1MmE='; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    # The STEP kernel alone needs dynamic WASM/Emscripten bindings.
    location = /step/occt.worker.js {
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'none'; object-src 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Each route has its own prerendered document. Never use an SPA fallback.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
